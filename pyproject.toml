[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earn-or-halt"
version = "0.1.0"
description = "An economic governor and signed bootstrap for autonomous service workers"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Earn or Halt contributors"}]
dependencies = []

[project.scripts]
earn-or-halt = "earn_or_halt.__main__:main"

[tool.setuptools]
packages = ["earn_or_halt"]
